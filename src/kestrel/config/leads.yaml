# Hiring-leads configuration (spec art_u0YGUqpk).
# Copy to ~/.kestrel/leads.yaml to override.
#
# Search provider that runs X-ray lead discovery: serp | tavily.
# Default tavily per the user's provider decision (Tavily free tier:
# 1,000 credits/month, basic search = 1 credit). Key: TAVILY_API_KEY
# (tavily) or SERP_API_KEY (serp).
provider: tavily

# A company is high-match when MAX(fit_score) across its member jobs
# reaches min_company_fit and at least one member job is scored.
# Scale note: the job scorer scores 1-10, so the default rides that
# scale (8 is a high bar on a 1-10 fit). Size the threshold to the
# scale your pipeline uses.
min_company_fit: 8

# Discovery runs allowed per UTC day (spec §4). Caps provider spend,
# not sends — Kestrel never sends anything.
daily_discovery_cap: 10

# Role titles the SERP X-ray queries search for at high-match companies.
role_taxonomy:
  - "Head of Talent"
  - "Head of Talent Acquisition"
  - "VP Talent Acquisition"
  - "Director of Recruiting"
  - "Recruiting Manager"
  - "Talent Partner"
  - "Founder" # small companies: the founder does the hiring
  - "COO"

serp:
  provider: serpapi # SerpAPI-compatible wire format; key: SERP_API_KEY
  results_per_query: 10

tavily:
  max_results: 10 # results per X-ray query; key: TAVILY_API_KEY

firecrawl:
  enabled: false # opt-in; public careers/team pages only, never
  # linkedin.com. Also requires FIRECRAWL_API_KEY.
