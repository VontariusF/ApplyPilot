<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApplyPilot Portal — Sign in</title>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>✈️ ApplyPilot Portal</h1>
    <p>Enter the portal token to continue. It was printed when the portal
       started (<code>~/.applypilot/portal_token</code>).</p>
    <form method="post" action="/login">
      <input type="password" name="token" placeholder="portal token" autofocus autocomplete="off" required>
      <button type="submit">Open portal</button>
    </form>
    <p class="hint">401 — every route requires the token.</p>
  </main>
</body>
</html>
