<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ApplyPilot Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/portal.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/ext-sse.js" defer></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">✈️ ApplyPilot</a>
    <div class="nav-links">
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
      <a href="/jobs" {% if request.url.path.startswith("/jobs") %}class="active"{% endif %}>Jobs</a>
      <a href="/runs" {% if request.url.path.startswith("/runs") %}class="active"{% endif %}>Runs</a>
      <a href="/settings" {% if request.url.path.startswith("/settings") %}class="active"{% endif %}>Settings</a>
    </div>
    <span class="localhost-note">localhost only</span>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
