{% extends "base.html" %}
{% block title %}Jobs · ApplyPilot Portal{% endblock %}
{% block content %}
<h1>Jobs</h1>

<section class="panel">
  <form class="filter-bar" hx-get="/jobs/table" hx-target="#jobs-table" hx-trigger="change, submit">
    <label>Stage
      <select name="stage">
        {% for s in stages %}
        <option value="{{ s }}" {{ 'selected' if s == stage }}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Min score <input type="number" name="min_score" min="0" max="10" value="{{ min_score }}"></label>
    <label>Limit <input type="number" name="limit" min="1" max="500" value="{{ limit }}"></label>
    <button type="submit">Filter</button>
  </form>
  <form method="post" action="/jobs/reset-failed" class="inline-form">
    <button type="submit" class="secondary">Reset failed</button>
  </form>
</section>

<div id="jobs-table">
  {% include "partials/jobs_table.html" %}
</div>
{% endblock %}
