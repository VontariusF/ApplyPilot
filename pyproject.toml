[project]
name = "kestrel-agent"
version = "0.1.0"
description = "The job-application pipeline your coding agent drives"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "The Kestrel Authors"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "python-jobspy>=1.4",
    "pypdf>=3.0",
    ]

[project.optional-dependencies]
# [portal]: the web portal stack (kestrel portal). Kept mirrored in
# `dev` so CI's single `pip install -e ".[dev]"` runs the portal tests too.
portal = [
    "fastapi>=0.104",
    "uvicorn>=0.27",
    "sse-starlette>=1.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
# [browser]: the built-in Playwright fallback engine — headless Chromium for
# page scraping (smart-extract, detail enrichment) and PDF rendering. An
# agent-driven install doesn't need it: the host agent's own browser covers
# page fetching. Kept in `dev` so the suite still exercises it.
browser = ["playwright>=1.40"]
# Optional tooling for the Composio discovery source. The discovery source
# itself talks to Composio's REST API over httpx (a base dependency) per the
# live-verified spike recipe; composio-core ships for users who want the
# broader SDK for one-off account management.
composio = ["composio-core>=0.7.21"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "playwright>=1.40",
    "fastapi>=0.104",
    "uvicorn>=0.27",
    "sse-starlette>=1.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
kestrel = "kestrel.cli:app"

[project.urls]
Homepage = "https://github.com/Vontarius-Ventures/kestrel"
Repository = "https://github.com/Vontarius-Ventures/kestrel"
Issues = "https://github.com/Vontarius-Ventures/kestrel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.hatch.build]
artifacts = ["src/kestrel/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing debt in src/ that this bootstrap task must not fix (no production
# code changes). The remediation deliverable (dead-code/hygiene items) removes
# these ignores when it lands.
"src/**" = ["E501", "F401", "F541", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Browser E2E (tests/e2e/): needs the Playwright Chromium binary
    # (`playwright install chromium`). CI installs it; locally the suite
    # skips these when the binary is missing.
    "e2e: browser end-to-end tests driven by Playwright Chromium",
]
